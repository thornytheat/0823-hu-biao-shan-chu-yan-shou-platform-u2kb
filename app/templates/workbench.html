{% extends "base.html" %}
{% import "widgets.html" as ui %}
{% block shell %}
<body class="lake">
<div class="desk-lake">
  <aside class="rail">
    <a class="brand" href="/" aria-label="返回首页">{{ p.mark }}</a>
    {{ ui.navigation(p) }}
    <a class="rail-link" href="#review-area">批次复核</a>
  </aside>
  <div class="work-lake">
    {{ ui.identity(p) }}
    <main class="grid main-lake">
    {{ ui.intake() }}
    {{ ui.metrics() }}
    {{ ui.results() }}
    {{ ui.visual(p) }}
    {{ ui.inspection() }}
    {{ ui.archive() }}
    </main>
    {{ ui.status() }}
  </div>
</div>
</body>
{% endblock %}
